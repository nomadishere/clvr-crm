<!DOCTYPE html>
<html lang="en">
<head>

<body>
<div class="band"><div class="in"><div class="logo"><img src="img/lucky-line-logo.png" alt="Lucky Line Roofing"></div>
 <div class="who"><b>Lucky Line Roofing</b><br>406-609-9950 · luckylineroofing.com<br>Livingston, Montana</div></div></div>
<div class="wrap" id="app"><div class="titlecard"><h1>Loading your proposal…</h1></div></div>
<script>
const SB='https://wwqjoagdnclaylllzcut.supabase.co',KEY='sb_publishable_AVIpI00DFiYwugP16-wMWQ_qENLObrc';
const T=new URLSearchParams(location.search).get('t')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const ROOF='<svg width="30" height="16" viewBox="0 0 30 16" aria-hidden="true"><path d="M1 9 L15 2 L29 9" fill="none" stroke="#16603A" stroke-width="2"/><line x1="7" y1="14" x2="23" y2="14" stroke="#16603A" stroke-width="2"/></svg>';
const hdr=s=>`<div class="hdr"><div class="brand">${ROOF}LUCKY LINE ROOFING</div><div class="section">${s}</div></div>`;
async function call(action,p){const r=await fetch(SB+'/rest/v1/rpc/crm_portal',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:T,p_action:action,p:p||{}})});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error((d&&d.message)||'Something went wrong. Please call 406-609-9950.');return d}
const A=document.getElementById('app');let D=null,pick=null;
const PEOPLE=`<div class="sec">${hdr('Questions?')}<div class="people"><div><b>Justin Walton</b><br><a href="tel:4153005496">415-300-5496</a><br><a href="mailto:jw@luckylineroofing.com">jw@luckylineroofing.com</a></div><div><b>Gage McDonnell</b><br><a href="tel:4066099950">406-609-9950</a><br><a href="mailto:gage.mcdonnell@luckylineroofing.com">gage.mcdonnell@luckylineroofing.com</a></div></div>
 <div class="ftr"><span><i>Shelter you can count on, service you'll remember.</i></span><span>406-609-9950 · luckylineroofing.com · Format v2</span></div></div>`;
const COL={eave:"#2EA84A",rake:"#E67E22",ridge:"#D64541",hip:"#8E44AD",valley:"#2B6FD8",edge:"#16A2B8",parapet:"#FFFFFF",flashing:"#F1C40F"};
function aerialSvg(M){const lines=M.lines||[];if(!lines.length)return `<img class="aerialimg" src="${esc(M.img)}" alt="Overhead view of the roof">`;const xs=lines.flatMap(l=>[l.x1,l.x2]),ys=lines.flatMap(l=>[l.y1,l.y2]),pad=70;
 const x0=Math.max(0,Math.min(...xs)-pad),y0=Math.max(0,Math.min(...ys)-pad),x1=Math.min(1280,Math.max(...xs)+pad),y1=Math.min(1280,Math.max(...ys)+pad),W=x1-x0,k=W/1000;
 return `<svg class="aerialsvg" viewBox="${x0} ${y0} ${W} ${y1-y0}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Overhead view of the roof with every edge measured"><image href="${esc(M.img)}" x="0" y="0" width="1280" height="1280"/>
 ${[0,1].map(pass=>lines.map(l=>`<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="${pass?COL[l.type]||'#fff':'#000'}" stroke-width="${(pass?7:12)*k}" stroke-linecap="round"/>`).join('')).join('')}
 ${lines.filter(l=>l.len>=6).map(l=>{const cx=(l.x1+l.x2)/2,cy=(l.y1+l.y2)/2,t=l.len+"'",w=(t.length*17+14)*k;return `<rect x="${cx-w/2}" y="${cy-19*k}" width="${w}" height="${38*k}" rx="${7*k}" fill="#fff"/><text x="${cx}" y="${cy+10*k}" font-size="${29*k}" font-weight="bold" text-anchor="middle" fill="#0B2545" font-family="Arial,sans-serif">${t}</text>`}).join('')}</svg>`}
const m2=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function fillAdd(t,d,o){const M=d.measure||{},tot=o?+o.total:0;return String(t).replace(/\{address\}/g,d.job.address||'the project address').replace(/\{area\}/g,M.areaFt2?(+M.areaFt2).toLocaleString('en-US')+' sq ft':'the measured area').replace(/\{squares\}/g,M.squares?M.squares+' squares':'the measured squares').replace(/\{deposit\}/g,m2(tot/2)).replace(/\{balance\}/g,m2(tot/2))}
function render(){const d=D,first=d.first||'there';const opts=d.options||[];if(!pick&&d.signed)pick=d.signed.estimate_id;if(!pick&&opts.length===1)pick=opts[0].id;
 const chosen=opts.find(o=>o.id===pick);
 const M=d.measure||null,L=(M&&M.lengths)||{};const ft=n=>(Number(n)||0).toLocaleString('en-US')+' ft';
 const MEAS=M&&M.img?`<div class="sec">${hdr('Roof measurements')}<div class="tiles"><div><b>${esc((+M.areaFt2||0).toLocaleString('en-US'))}</b><span>Roof area (sq ft)</span></div><div><b>${esc(M.squares||'')}</b><span>Squares (waste incl.)</span></div><div><b>${esc(M.pitch||'')}</b><span>Pitch</span></div></div><table><thead><tr><th>Edge</th><th class="num">Length</th></tr></thead><tbody>${[['eave','Eaves'],['rake','Rakes'],['ridge','Ridge'],['hip','Hips'],['valley','Valleys']].filter(k=>+L[k[0]]).map(k=>`<tr><td>${k[1]}</td><td class="num">${ft(L[k[0]])}</td></tr>`).join('')}</tbody></table><p class="muted" style="font-size:13px">Measured from aerial imagery${M.imagery?' ('+esc(M.imagery)+')':''}. Waste is included in the price.</p></div>`:'';
 A.innerHTML=`<div class="titlecard">${M&&M.img?`<div class="cover">${aerialSvg(M)}</div>`:''}<h1>Roof Proposal</h1><div class="prop">${esc(d.job.title)}${d.job.address?'<br><span style="font-weight:normal">'+esc(d.job.address)+'</span>':''}</div>
  <div class="meta">Prepared for: ${esc(d.customer)}<br>Prepared by: Justin Walton, Lucky Line Roofing LLC<br>Good through: ${esc(d.valid_until)}</div><div class="tag">Shelter you can count on, service you'll remember.</div></div>
 ${d.signed?`<div class="sec ok"><h2>Signed. Thank you, ${esc(first)}!</h2><p>${esc(d.signed.name)} accepted <b>${esc((opts.find(o=>o.id===d.signed.estimate_id)||{}).name||'the proposal')}</b> (${money(d.signed.total)}) on ${esc(d.signed.at)}.</p><p>We'll call you shortly to set up the deposit and pick an install date. Keep this page for your records.</p><div class="row no-print"><button class="btn" onclick="print()">Print or save as PDF</button></div></div>`:''}
 <div class="sec">${hdr('A note from us')}${d.job.letter?`<div class="letter">${esc(d.job.letter.replace(/\n*Justin Walton[\s\S]*$/,'').trim())}</div>`:`<p>Hi ${esc(first)},</p><p>Thank you for having us out. We're local to Livingston, and our advice is always free, whether or not you hire us. Below is what we found and your options, explained plainly.</p>`}
  <p style="margin-top:10px">With gratitude,<br><b>Justin &amp; Gage</b><br>Lucky Line Roofing</p></div>
 ${MEAS}
 ${d.summary||(d.findings||[]).length?`<div class="sec">${hdr('What we found')}${d.summary?`<p>${esc(d.summary)}</p>`:''}${(d.findings||[]).map(f=>`<div class="find"><span class="lvl ${esc((f.severity||'').toLowerCase())}">${esc(f.severity||'')}</span> <b>${esc(f.title||f.area||'')}</b>${f.category?`<div class="muted" style="font-size:13px">${esc(f.category)}</div>`:''}<div>${esc(f.description||f.issue||'')}</div>${f.img?`<img class="fimg" src="${esc(f.img)}" alt="" loading="lazy">`:''}</div>`).join('')}
  ${d.report_url?`<div class="row no-print"><a class="btn" href="${esc(d.report_url)}" target="_blank" rel="noopener">See the full photo report</a></div>`:''}</div>`:''}
 <div class="sec">${hdr('Recommendation & Proposals')}<h2>${opts.length>1?'Your options':'Our proposal'}</h2>${opts.length>1?'<p class="muted">Tap the option you want, then sign at the bottom.</p>':''}
  ${opts.map(o=>`<label class="opt ${o.id===pick?'on':''}"><div class="top">${d.signed?'':`<input type="radio" name="opt" value="${o.id}" ${o.id===pick?'checked':''} onchange="pick='${o.id}';render()">`}<div style="flex:1;min-width:0"><div><span class="nm">${esc(o.name)}</span>${o.tier?`<span class="tier">${esc(o.tier)}</span>`:''}</div>${o.summary?`<div class="muted" style="font-size:13.5px">${esc(o.summary)}</div>`:''}</div></div>
   <table><thead><tr><th>Scope</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead><tbody>${(o.lines||[]).map(l=>`<tr><td>${esc(l.item)}</td><td class="num">${esc(+l.qty)} ${esc(l.unit||'')}</td><td class="num">${money(l.amount)}</td></tr>`).join('')}<tr class="total"><td colspan="2">TOTAL INVESTMENT</td><td class="num">${money(o.total)}</td></tr></tbody></table></label>`).join('')||'<p>Your options are being finalized. Please call 406-609-9950.</p>'}
  <div class="cols"><div class="box"><h4>Warranty, Payment &amp; Schedule</h4>${esc(d.terms||'50% deposit to get on the schedule, balance at substantial completion.')}${chosen?`<br><b>Deposit due on acceptance: ${money(chosen.total/2)}</b><br><b>Balance at substantial completion: ${money(chosen.total/2)}</b>`:''}</div><div class="box"><h4>Notes &amp; Exclusions</h4>Anything outside the scope above, including hidden damage found during tear-off (like rotted decking), is only done with your written OK on a change order. Proposal good for 30 days.</div></div>
  ${d.financing_link?`<div class="row no-print"><a class="btn" href="${esc(d.financing_link)}" target="_blank" rel="noopener">See monthly payment options</a></div>`:''}</div>
 ${d.addendum?`<div class="sec">${hdr('Terms & conditions')}<div class="addn">${esc(fillAdd(d.addendum,d,chosen||opts[0]))}</div></div>`:''}
 ${!d.signed&&opts.length?`<div class="sec no-print" id="acc">${hdr('Acceptance')}<h2>Accept and sign</h2>
  <p>${chosen?`You're accepting <b>${esc(chosen.name)}</b> for <b>${money(chosen.total)}</b>.`:'<b>Pick an option above first.</b>'}</p>
  <label class="f" for="nm">Your full name</label><input type="text" id="nm" autocomplete="name" value="${esc(d.customer||'')}">
  <label class="f" for="em">Email (for your copy)</label><input type="email" id="em" autocomplete="email">
  <label class="f">Sign with your finger</label><div class="padwrap"><canvas class="pad" id="pad" aria-label="Signature box"></canvas><div class="padline"></div></div>
  <div class="row" style="margin-top:6px"><button class="btn" style="flex:0 1 auto;min-height:38px" onclick="clearPad()">Clear signature</button></div>
  <label class="agree"><input type="checkbox" id="ag"><span>I accept this proposal and the payment terms above, and authorize Lucky Line Roofing LLC to do the work.</span></label>
  <div class="err" id="err" role="alert"></div><div class="row"><button class="btn p" id="go" onclick="sign()">Sign &amp; accept</button></div></div>`:''}
 ${PEOPLE}`;
 if(!d.signed&&opts.length)setupPad()}
let pad,ctx,inked=false;
function setupPad(){pad=document.getElementById('pad');const r=pad.getBoundingClientRect(),k=window.devicePixelRatio||1;pad.width=r.width*k;pad.height=r.height*k;ctx=pad.getContext('2d');ctx.scale(k,k);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14231a';inked=false;let down=false,last=null;
 const pt=e=>{const b=pad.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
 pad.onpointerdown=e=>{down=true;last=pt(e);pad.setPointerCapture(e.pointerId);e.preventDefault()};
 pad.onpointermove=e=>{if(!down)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;inked=true;e.preventDefault()};
 pad.onpointerup=pad.onpointercancel=()=>{down=false}}
function clearPad(){if(ctx){ctx.clearRect(0,0,pad.width,pad.height);inked=false}}
function sigPng(){const k=Math.min(1,600/pad.width),c=document.createElement('canvas');c.width=Math.round(pad.width*k);c.height=Math.round(pad.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(pad,0,0,c.width,c.height);return c.toDataURL('image/png')}
async function sign(){const E=document.getElementById('err');E.textContent='';const nm=document.getElementById('nm').value.trim();
 if(!pick){E.textContent='Pick an option above first.';return}if(nm.length<2){E.textContent='Please type your full name.';return}if(!inked){E.textContent='Please sign in the box.';return}if(!document.getElementById('ag').checked){E.textContent='Please check the box to accept.';return}
 const b=document.getElementById('go');b.disabled=true;b.textContent='Signing…';
 try{await call('sign',{estimate_id:pick,name:nm,email:document.getElementById('em').value.trim(),signature:sigPng(),ua:navigator.userAgent});D=await call('view');render();scrollTo({top:0,behavior:'smooth'})}catch(e){E.textContent=e.message;b.disabled=false;b.textContent='Sign & accept'}}
(async()=>{try{D=await call('view');render()}catch(e){A.innerHTML=`<div class="titlecard"><h1>We couldn't open this proposal</h1><p>${esc(e.message)}</p><div class="row"><a class="btn p" href="tel:4066099950">Call 406-609-9950</a></div></div>`}})();
addEventListener('resize',()=>{if(pad&&!inked)setupPad()});
</script>
